[project]
name = "timesheet-banco-horas-desktop"
version = "1.0.0"
description = "Aplicação desktop local para ler prints do Banco de Horas e gerar timesheet Excel."
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10.0.0",
  "openpyxl>=3.1.0",
  "PySide6>=6.6",
  "pdfplumber>=0.11.0",
]

[project.optional-dependencies]
dev = ["pyinstaller>=6.0.0"]

[tool.setuptools.packages.find]
include = ["timesheet_app*"]
