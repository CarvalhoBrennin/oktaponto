name: Android integration smoke

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  android-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      - run: ./tool/bootstrap_platforms.sh
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Create Android emulator
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "emulator" "platforms;android-36" "system-images;android-35;google_apis;x86_64"
          echo no | avdmanager create avd \
            --force \
            --name horafolio_ci \
            --package "system-images;android-35;google_apis;x86_64"
          nohup emulator -avd horafolio_ci \
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim \
            > "$RUNNER_TEMP/emulator.log" 2>&1 &
          adb wait-for-device
          timeout 300 bash -c 'until [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" == "1" ]]; do sleep 2; done'
          adb shell input keyevent 82 || true
      - name: Run UI integration flow
        run: flutter test integration_test -d emulator-5554
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: android-emulator-log
          path: ${{ runner.temp }}/emulator.log
          if-no-files-found: ignore
          retention-days: 14
