name: horafolio
description: HoraFólio mobile offline-first time clock.
publish_to: "none"
version: 2.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  drift: 2.34.4
  drift_flutter: 0.3.1
  flutter_riverpod: 3.4.3
  excel_plus: 2.18.0
  share_plus: 13.3.0
  path_provider: 2.1.6
  path: 1.9.1
  intl: 0.20.3
  clock: 1.1.3
  flutter_local_notifications: 22.3.0
  timezone: ^0.11.1
  flutter_timezone: 5.1.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  drift_dev: 2.34.6
  build_runner: 2.16.1
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
